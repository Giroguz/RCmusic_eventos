services:
  - type: web
    name: rc-music-eventos-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_DAILY_CALL_LIMIT
        value: '100'
      - key: YOUTUBE_CACHE_TTL_MS
        value: '21600000'
      - key: YOUTUBE_CACHE_MAX_ENTRIES
        value: '500'
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
