<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear nueva clave · RC music</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#09070f;color:#fff;font:16px system-ui,sans-serif}main{width:min(100%,430px);padding:30px;border:1px solid #ffffff1c;border-radius:28px;background:#171322;box-shadow:0 20px 60px #0008}h1{margin:0 0 12px;font-size:30px}p{color:#ffffff99;line-height:1.5}label{display:block;margin:16px 0 7px;color:#ffffffbb;font-size:14px;font-weight:700}input{width:100%;padding:15px;border:1px solid #ffffff25;border-radius:12px;background:#0d0a16;color:#fff;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#d946ef;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.ok{color:#5eead4}.err{color:#fda4af}</style>
</head><body><main><h1>Crear nueva clave</h1><p>Coloca el número de verificación recibido por correo y define el nuevo código del Panel DJ.</p><form id="form"><label for="verification">Número de verificación</label><input id="verification" inputmode="numeric" autocomplete="one-time-code" placeholder="Código recibido por correo"><label for="code">Nuevo código (8–64 caracteres)</label><input id="code" type="password" minlength="8" maxlength="64" required autocomplete="new-password" placeholder="Nuevo código"><button id="save">Guardar nuevo código</button></form><p id="message"></p></main>
<script>
const SUPABASE_URL='https://fzqpmpgbubpmongodcat.supabase.co';const ANON_KEY='sb_publishable_xBf6lKVYwyep1axruoC99w_rFX0lMGt';const hashToken=new URLSearchParams(location.hash.slice(1)).get('access_token');const pending=JSON.parse(sessionStorage.getItem('rc_pending_recovery_v1')||'null')||{};const form=document.getElementById('form'),verification=document.getElementById('verification'),code=document.getElementById('code'),message=document.getElementById('message'),save=document.getElementById('save');
form.onsubmit=async e=>{e.preventDefault();message.className='';save.disabled=true;save.textContent='Guardando…';try{let token=hashToken;if(!token){const email=(pending.email||'').trim().toLowerCase();const otp=verification.value.trim();if(!email||!otp)throw new Error('Escribe el número de verificación recibido por correo.');const verify=await fetch(SUPABASE_URL+'/auth/v1/verify',{method:'POST',headers:{apikey:ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({type:'email',email,token:otp})});const verified=await verify.json();if(!verify.ok||!verified.access_token)throw new Error('El número de verificación no fue aceptado o ya venció.');token=verified.access_token}const value=code.value.trim();if(value.length<8||value.length>64)throw new Error('El nuevo código debe tener entre 8 y 64 caracteres.');const response=await fetch(SUPABASE_URL+'/rest/v1/rpc/dj_set_recovery_code_from_session',{method:'POST',headers:{apikey:ANON_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({p_new_code:value})});if(!response.ok)throw new Error('No se pudo guardar el nuevo código.');message.className='ok';message.textContent='Nuevo código guardado correctamente. Ya puedes volver al Panel DJ.';form.reset();sessionStorage.removeItem('rc_pending_recovery_v1')}catch(err){message.className='err';message.textContent=err.message}finally{save.disabled=false;save.textContent='Guardar nuevo código'}};
</script></body></html>
