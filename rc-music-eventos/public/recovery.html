<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear nueva clave · RC music</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#09070f;color:#fff;font:16px system-ui,sans-serif}main{width:min(100%,430px);padding:30px;border:1px solid #ffffff1c;border-radius:28px;background:#171322;box-shadow:0 20px 60px #0008}h1{margin:0 0 12px;font-size:30px}p{color:#ffffff99;line-height:1.5}.field{position:relative}input{width:100%;padding:15px 48px 15px 15px;border:1px solid #ffffff25;border-radius:12px;background:#0d0a16;color:#fff;font-size:16px}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:#d946ef;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.toggle{position:absolute;right:10px;top:9px;width:auto;margin:0;padding:7px;background:transparent;color:#ffffff99;font-size:13px}.ok{color:#5eead4}.err{color:#fda4af}
</style>
</head><body><main><h1>Crear nueva clave</h1><p>Escribe tu nueva clave para el Panel DJ. La clave anterior quedará reemplazada al guardar.</p><form id="form"><div class="field"><input id="code" type="password" minlength="8" maxlength="64" required autocomplete="new-password" placeholder="Nueva clave"><button type="button" class="toggle" id="toggle">Mostrar</button></div><button id="save">Guardar</button></form><p id="message"></p></main>
<script>
const SUPABASE_URL='https://fzqpmpgbubpmongodcat.supabase.co';const ANON_KEY='sb_publishable_xBf6lKVYwyep1axruoC99w_rFX0lMGt';const token=new URLSearchParams(location.hash.slice(1)).get('access_token');const form=document.getElementById('form'),code=document.getElementById('code'),message=document.getElementById('message'),save=document.getElementById('save');
document.getElementById('toggle').onclick=()=>{code.type=code.type==='password'?'text':'password';document.getElementById('toggle').textContent=code.type==='password'?'Mostrar':'Ocultar'};
form.onsubmit=async e=>{e.preventDefault();message.className='';if(!token){message.className='err';message.textContent='Enlace inválido o vencido. Solicita otro enlace.';return}save.disabled=true;save.textContent='Guardando…';try{const value=code.value.trim();if(!/^[A-Za-z0-9!@#$%_.*+?=-]{8,64}$/.test(value))throw new Error('La clave debe tener entre 8 y 64 caracteres y usar letras, números o símbolos comunes.');const response=await fetch(SUPABASE_URL+'/rest/v1/rpc/dj_set_recovery_code_from_session',{method:'POST',headers:{apikey:ANON_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({p_new_code:value})});if(!response.ok)throw new Error('No se pudo guardar la clave.');message.className='ok';message.textContent='Clave creada correctamente. Ya puedes volver al Panel DJ.';form.reset()}catch(err){message.className='err';message.textContent=err.message}finally{save.disabled=false;save.textContent='Guardar'}};
</script></body></html>
